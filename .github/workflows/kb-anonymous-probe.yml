name: KB anonymous API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe KB production API without credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, ssl
          base="https://developer.kbsec.com:32484"
          tests=[
            ("anonymous_token","/oauth2/token",{
              "dataHeader":{"ipAddr":"","macAddr":""},
              "dataBody":{"appKey":"","appSecret":"","grantType":"client_credentials"}
            }, {}),
            ("anonymous_samsung_integrated","/api/v1/ivu10140",{
              "dataHeader":{"ipAddr":"","macAddr":""},
              "dataBody":{"excg_clsf":"0","shrt_cd":"005930"}
            }, {})
          ]
          ctx=ssl.create_default_context()
          for name,path,body,extra in tests:
            print("\n===== "+name+" =====")
            data=json.dumps(body).encode()
            headers={"Content-Type":"application/json", **extra}
            req=urllib.request.Request(base+path,data=data,headers=headers,method="POST")
            try:
              with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                print("HTTP",r.status)
                print(r.read().decode("utf-8","replace")[:4000])
            except urllib.error.HTTPError as e:
              print("HTTP",e.code)
              print(e.read().decode("utf-8","replace")[:4000])
            except Exception as e:
              print(type(e).__name__,repr(e))
          PY
