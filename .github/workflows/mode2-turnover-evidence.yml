name: 模式2逐股20日成交额证据审计（不发布）
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download official audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download --repo "${{ github.repository }}" --name krx-nxt-240d-merge-audit --dir merged_240d_audit
          test -f merged_240d_audit/krx_nxt_daily_turnover.csv
      - name: Rebuild threshold from exactly the downloaded daily snapshot
        run: |
          python -m py_compile scripts/nxt_forensic_audit.py
          python scripts/nxt_forensic_audit.py
      - name: Run stock-by-stock evidence audit
        run: |
          python -m py_compile scripts/mode2_turnover_evidence.py
          python scripts/mode2_turnover_evidence.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [Path("merged_240d_audit/krx_nxt_daily_turnover.csv"), Path("nxt_forensic_audit/threshold_500eok_20d.csv")]
          manifest = {"provenance": "threshold regenerated in this workflow from the same merged daily CSV", "files": {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          Path("turnover_evidence_20d/source_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Summary
        if: always()
        run: |
          if [ -f turnover_evidence_20d/audit_report.md ]; then cat turnover_evidence_20d/audit_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode2-20d-stock-evidence
          path: turnover_evidence_20d/
          if-no-files-found: warn
