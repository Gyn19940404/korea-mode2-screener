name: KRX OpenAPI 体检（只读，不发布）

# 只做一件事：把 KRX 各服务的真实 HTTP 状态和行数打成表，
# 显示在 Actions 的 Summary 里。不写仓库、不发布网页、不需要 pages 权限。
#
# 什么时候用：
#   · 每日更新 workflow 失败、但看不出原因时
#   · 怀疑 key 失效 / 服务授权到期 / 新申请的服务有没有批下来时
#   · 想知道 KRX 官方数据实际发布到哪一天时（看「逐日覆盖」那节）
#
# 用法：Actions → 本 workflow → Run workflow

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "服务授权检查的基准交易日 YYYYMMDD（留空取最近工作日）"
        required: false
        default: ""
      sweep_days:
        description: "逐日回扫的工作日数量（默认 8）"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: krx-status-check
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Probe KRX OpenAPI
        id: probe
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SWEEP_DAYS: ${{ inputs.sweep_days }}
        run: |
          set -o pipefail
          python -u scripts/krx_status.py | tee probe_result.md

      - name: Write to job summary
        if: always()
        run: cat probe_result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-status
          path: probe_result.md
          if-no-files-found: ignore
