name: verify KRX 12001 auto CSV

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "验证交易日 YYYYMMDD"
        required: true
        default: "20261007"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: 自动下载KRX 12001 전종목 시세 CSV
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: python scripts/krx_official_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-12001-probe
          path: |\n            .data_cache/krx_12001_probe.json\n            .data_cache/krx_12001_probe.csv
          if-no-files-found: ignore
