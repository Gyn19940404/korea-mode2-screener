name: verify NAVER daily freshness

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "目标交易日 YYYYMMDD"
        required: true
        default: "20261007"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check NAVER OHLCV and turnover
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: python scripts/krx_official_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naver-freshness-probe
          path: .data_cache/naver_freshness_probe.json
          if-no-files-found: ignore
