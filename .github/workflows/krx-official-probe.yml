name: verify KRX 12001 auto CSV

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "验证交易日 YYYYMMDD"
        required: true
        default: "20261007"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Download KRX 12001 CSV
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: python scripts/krx_official_probe.py

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-12001-probe
          path: |
            .data_cache/krx_12001_probe.json
            .data_cache/krx_12001_probe.csv
          if-no-files-found: ignore
