name: NXT资格与缺失记录交叉诊断（不发布）
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download merged 240-day official data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download --repo "${{ github.repository }}" --name krx-nxt-240d-merge-audit --dir merged_240d_audit
          test -f merged_240d_audit/krx_nxt_daily_turnover.csv
      - name: Diagnose missing NXT observations separately from eligibility
        run: |
          python -m py_compile scripts/mode2_nxt_eligibility_diagnostic.py
          python scripts/mode2_nxt_eligibility_diagnostic.py
      - name: Summary
        if: always()
        run: |
          if [ -f nxt_eligibility_diagnostic/audit_report.md ]; then cat nxt_eligibility_diagnostic/audit_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nxt-eligibility-diagnostic
          path: nxt_eligibility_diagnostic/
          if-no-files-found: warn
