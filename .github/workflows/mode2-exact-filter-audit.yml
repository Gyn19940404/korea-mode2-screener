name: 模式2第十阶段完整默认筛选复核（不发布）
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified 20-day gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download --repo "${{ github.repository }}" --name mode2-turnover-gate-test --dir mode2_turnover_gate_test
          test -f mode2_turnover_gate_test/mode2_turnover_gate.csv
      - name: Run independent full default filter audit
        run: |
          python -m py_compile scripts/mode2_exact_filter_audit.py
          python scripts/mode2_exact_filter_audit.py
      - name: Append audit summary
        if: always()
        run: |
          if [ -f mode2_exact_filter_audit/audit_report.md ]; then cat mode2_exact_filter_audit/audit_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode2-exact-filter-audit
          path: mode2_exact_filter_audit/
          if-no-files-found: warn
