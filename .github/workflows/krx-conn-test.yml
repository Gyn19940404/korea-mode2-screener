name: krx index connectivity test (temporary)

# 临时只读测试：验证 KRX OpenAPI 指数服务（KOSPI/KOSDAQ/KRX）连通性。
# 不修改 main 上的数据，不输出密钥；探测结果提交到 diag/krx-conn 分支供读取。

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "目标交易日 basDd (YYYYMMDD)"
        required: true
        default: "20261015"
  push:
    branches: [ main ]
    paths:
      - .github/workflows/krx-conn-test.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Verify secret is wired (value never printed)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          if [ -z "$KRX_API_KEY" ]; then
            echo "SECRET_MISSING: repository secret KRX_API_KEY is not available to this job"
            exit 3
          fi
          echo "SECRET_PRESENT: length=${#KRX_API_KEY}"

      - name: Probe three indices (as coded in scripts/krx_official.py)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.trade_date || '20261015' }}
        run: |
          echo "=== target date: $TARGET_DATE ==="
          set +e
          python -u scripts/krx_official.py "$TARGET_DATE" 2>&1 | tee probe_output.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "PROBE_EXIT_CODE=$code"
          echo "PROBE_EXIT_CODE=$code" > probe_exit_code.txt

      - name: Probe canonical idx endpoints
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.trade_date || '20261015' }}
        run: |
          mkdir -p .diag
          python - <<'PY'
          import json, os
          import requests

          key = os.environ["KRX_API_KEY"]
          d = os.environ.get("TARGET_DATE", "20261015")
          BASE = "https://data-dbg.krx.co.kr/svc/apis"
          targets = [
              ("sto", "stk_bydd_trd"),   # 已知可用端点：用来判别 key 是否有效
              ("sto", "ksq_bydd_trd"),
              ("idx", "kospi_dd_trd"),
              ("idx", "kosdaq_dd_trd"),
              ("idx", "krx_dd_trd"),
          ]
          out = []
          for cat, ep in targets:
              label = f"{cat}/{ep}"
              dates = [d] if d == "20261016" else [d, "20261016"]
              item = {"endpoint": label, "attempts": []}
              for bd in dates:
                  rec = {"date": bd}
                  try:
                      r = requests.get(f"{BASE}/{cat}/{ep}",
                                       params={"AUTH_KEY": key, "basDd": bd},
                                       timeout=40)
                      rec["http"] = r.status_code
                      try:
                          p = r.json()
                      except Exception:
                          rec["body_preview"] = r.text[:300]
                          item["attempts"].append(rec)
                          continue
                      rows = p.get("OutBlock_1") if isinstance(p, dict) else None
                      rec["respCode"] = p.get("respCode") if isinstance(p, dict) else None
                      rec["respMsg"] = p.get("respMsg") if isinstance(p, dict) else None
                      if isinstance(rows, list):
                          rec["rows"] = len(rows)
                          if rows:
                              rec["field_count"] = len(rows[0])
                              rec["sample_keys"] = list(rows[0].keys())
                              rec["sample"] = rows[0]
                      else:
                          rec["body_preview"] = r.text[:300]
                  except Exception as exc:
                      rec["error"] = f"{type(exc).__name__}: {exc}"
                  item["attempts"].append(rec)
                  if rec.get("rows"):
                      break
              out.append(item)
              print(json.dumps(item, ensure_ascii=False)[:900])

          with open(".diag/idx_canonical.json", "w", encoding="utf-8") as fh:
              json.dump(out, fh, ensure_ascii=False, indent=2)
          PY

      - name: Publish result to diag branch
        if: always()
        run: |
          mkdir -p .diag
          cp probe_output.txt probe_exit_code.txt .diag/ 2>/dev/null || true
          cp krx_index_diagnostic_*.json .diag/ 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diag/krx-conn
          git add -f .diag
          git commit -m "diag: krx index connectivity result ($(date -u +%FT%TZ))" || echo "nothing to commit"
          git push --force origin diag/krx-conn
