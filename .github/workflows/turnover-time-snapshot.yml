name: 10股三时间点量价对照 V0.9.53

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；对应韩国时间约 08:55 / 15:35 / 20:05
    # 特意比边界晚5分钟，避免刚收盘时数据尚未刷新。
    - cron: "55 23 * * 0-4"
    - cron: "35 6 * * 1-5"
    - cron: "5 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: korea-mode2-three-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 读取项目
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装行情组件
        run: pip install -r requirements.txt

      - name: 诊断脚本语法自检
        run: python -m py_compile scripts/diagnostic_market.py scripts/turnover_time_snapshot.py

      - name: 抓取成交量+成交额快照（完全独立）
        shell: bash
        run: |
          set -e
          for n in 1 2 3; do
            echo "诊断抓取尝试 $n/3"
            if python scripts/turnover_time_snapshot.py; then
              exit 0
            fi
            if [ "$n" -lt 3 ]; then sleep 20; fi
          done
          exit 1

      - name: 持久保存三时间点快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          # 诊断任务只允许提交自己的快照文件，绝不提交 stocks_data.js / index.html / update_data.py
          git add .data_cache/nxt_time_samples.json
          if git diff --cached --quiet; then
            echo "快照无变化"
          else
            git commit -m "diagnostic: persist 10-stock time snapshot"
            git push
          fi
