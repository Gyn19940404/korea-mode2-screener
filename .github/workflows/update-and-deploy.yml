name: 每日20点30分更新并发布网页 V0.9.48

on:
  workflow_dispatch:
  schedule:
    # UTC 11:30 = 韩国时间 20:30
    - cron: "30 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: korea-mode2-daily-close
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 正式脚本语法自检
        run: python -m py_compile scripts/update_data.py

      - name: Generate current trading day data
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        shell: bash
        run: |
          set -e
          for n in 1 2 3; do
            echo "正式数据抓取尝试 $n/3"
            if python scripts/update_data.py; then
              exit 0
            fi
            if [ "$n" -lt 3 ]; then sleep 30; fi
          done
          echo "连续3次失败，停止发布，保留线上上一版正确数据"
          exit 1

      - name: Validate stocks_data.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p = Path("stocks_data.js")
          if not p.exists():
              raise SystemExit("stocks_data.js 未生成")
          if p.stat().st_size < 1_000_000:
              raise SystemExit(f"stocks_data.js 异常过小: {p.stat().st_size} bytes")
          s = p.read_text(encoding="utf-8")
          m = re.search(r'window\.DATA_META=(\{.*?\});', s, re.S)
          if not m:
              raise SystemExit("找不到 DATA_META")
          meta = json.loads(m.group(1))
          print("网页正式交易日:", meta.get("latest_date"))
          print("云端更新时间:", meta.get("updated_at"))
          print("股票数:", meta.get("total_count"))
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks_data.js .data_cache/ turnover_raw_diagnostic.csv nxt_session_diagnostic.json universe_type_diagnostic.csv trading_status_diagnostic.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "数据文件没有变化"
          else
            git commit -m "data: update daily close"
            git push
          fi

      # 关键修复：不再等另一个Pages工作流被push触发，
      # 当前任务生成完 stocks_data.js 后，立即把当前仓库内容发布到Pages。
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload current site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy current site to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Final message
        run: |
          echo "V0.9.48 完成：数据生成、提交、GitHub Pages发布在同一次任务中完成。"
