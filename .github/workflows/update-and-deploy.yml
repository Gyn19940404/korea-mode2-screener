name: Update Korean Stock Data and Deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .data_cache
          key: korea-mode2-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            korea-mode2-data-${{ runner.os }}-

      - name: Update stock data
        run: python scripts/update_data.py

      - name: Validate generated data
        shell: bash
        run: |
          test -s stocks_data.js
          SIZE=$(wc -c < stocks_data.js)
          echo "stocks_data.js size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "stocks_data.js is unexpectedly small; refusing to publish."
            exit 1
          fi

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks_data.js .data_cache || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh Korean stock data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
