name: 更新韩股数据并部署网页

on:
  workflow_dispatch:
  schedule:
    # NXT官网行情约20分钟延迟；20:30 KST = 11:30 UTC
    - cron: "30 11 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取项目
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 缓存历史数据
        uses: actions/cache@v4
        with:
          path: .data_cache
          key: korea-mode2-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            korea-mode2-history-${{ runner.os }}-

      - name: 安装行情组件
        run: pip install -r requirements.txt

      - name: 更新全市场数据
        run: python scripts/update_data.py

      - name: 校验数据文件
        run: |
          test -f stocks_data.js
          SIZE=$(wc -c < stocks_data.js)
          echo "stocks_data.js size=$SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "数据文件过小，拒绝部署"
            exit 1
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
