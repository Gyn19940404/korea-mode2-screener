name: 每日20点30分更新当日收盘 V0.9.47

on:
  workflow_dispatch:
  schedule:
    # GitHub cron使用UTC；11:30 UTC = 韩国时间20:30
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: korea-mode2-daily-close
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate current trading day data
        run: python scripts/update_data.py

      - name: Validate output
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("stocks_data.js")
          if not p.exists():
              raise SystemExit("stocks_data.js未生成")
          if p.stat().st_size < 1_000_000:
              raise SystemExit(f"stocks_data.js异常过小: {p.stat().st_size} bytes")
          print("stocks_data.js:", p.stat().st_size, "bytes")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks_data.js .data_cache/ || true
          if git diff --cached --quiet; then
            echo "没有新数据，无需提交"
          else
            git commit -m "data: update daily close"
            git push
          fi
